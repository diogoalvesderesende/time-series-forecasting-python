name: Build and deploy site

# Renders every notebook and doc to plain HTML and publishes it to GitHub Pages.
# Notebook bodies live inside .ipynb JSON, which crawlers index poorly, so this
# gives the course content a stable, readable URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          # DejaVu is what the preview script falls back to off Windows. Without a
          # real TrueType font PIL drops to a bitmap and the card is unreadable.
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          pip install nbconvert markdown pillow

      - name: Generate the social preview image
        run: python scripts/make_social_preview.py

      - name: Build the site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
